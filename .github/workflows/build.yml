name: Gerar Executavel Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python no Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Executar testes de regressão
        run: python -m pytest -q

      - name: Executar o script de build
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python construir_executavel.py

      - name: Disponibilizar o .exe para download
        uses: actions/upload-artifact@v4
        with:
          name: OrganizadorInteligente-Windows
          path: dist/OrganizadorInteligente.exe
